plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.lechaterrant.arscan'
version = '0.1.0'

android {
  namespace "io.lechaterrant.arscan"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.ar:core:1.57.0'
}
