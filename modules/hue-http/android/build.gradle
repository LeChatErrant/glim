plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.lechaterrant.huehttp'
version = '0.1.0'

android {
  namespace "io.lechaterrant.huehttp"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // FastWidgetProvider extends the widget library's provider.
  implementation project(':react-native-android-widget')
  // Renders the map widget's weather frames (same SVG library the widget library uses).
  implementation 'com.caverock:androidsvg-aar:1.4'
}
